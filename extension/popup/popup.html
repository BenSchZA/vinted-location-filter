<!doctype html>
<meta charset="utf-8">
<title>Vinted Location Filter</title>
<link rel="stylesheet" href="popup.css">

<header>
  <a class="repo" href="https://github.com/BenSchZA/vinted-location-filter"
     target="_blank" rel="noopener noreferrer"
     title="View source on GitHub" aria-label="View source on GitHub">
    <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
      <path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"></path>
    </svg>
  </a>
  <h1>Seller location</h1>
  <p id="summary">Checking this tab...</p>
</header>

<div id="panel" hidden>
  <ul id="places"></ul>

  <section>
    <span class="label">Non-matching results</span>
    <div class="segmented">
      <button data-mode="remove">Hide</button>
      <button data-mode="fade">Fade</button>
    </div>
  </section>

  <section>
    <label class="switch">
      <input type="checkbox" id="city">
      <span>Show city on each card</span>
    </label>
    <p class="hint">One throttled request per seller, so cities fill in while you
      scroll. Sellers who left the city blank show the country only.</p>
  </section>
</div>

<p id="idle" class="hint" hidden>Open a Vinted search to use the filter.</p>

<footer>
  <button id="clear" class="quiet">Clear cached sellers</button>
  <a class="coffee" href="https://buymeacoffee.com/benscholtz" target="_blank" rel="noopener noreferrer">Buy me a coffee</a>
</footer>

<script src="../src/origins.js"></script>
<script src="../src/settings.js"></script>
<script src="popup.js"></script>
